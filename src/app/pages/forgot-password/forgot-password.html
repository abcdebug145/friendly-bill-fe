<div class="min-h-screen bg-gradient-to-r from-emerald-600 via-emerald-200 to-white flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/90 rounded-2xl border border-white/70 shadow-sm p-6 sm:p-8">
    <p class="text-sm font-semibold text-emerald-600 uppercase tracking-wide">FriendlyBill</p>
    <h1 class="text-3xl font-bold text-slate-900 mt-1">Quên mật khẩu</h1>
    <p class="text-sm text-slate-500 mt-2">Nhập email để nhận link đặt lại mật khẩu.</p>

    <form class="space-y-4 mt-6" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500"
        />
      </div>

      @if (errorMessage) {
        <p class="text-sm text-rose-600 text-center">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="text-sm text-emerald-600 text-center">{{ successMessage }}</p>
      }

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 font-semibold disabled:opacity-60"
      >
        {{ isSubmitting ? 'Đang gửi...' : 'Gửi link đặt lại' }}
      </button>
    </form>

    <p class="text-sm text-slate-600 text-center mt-6">
      <a routerLink="/login" class="font-semibold text-emerald-600 hover:text-emerald-700">Quay lại đăng nhập</a>
    </p>
  </div>
</div>
